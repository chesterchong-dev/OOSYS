name: Phase 00 validation

on:
  push:
    branches:
      - phase-00-02-starter
  pull_request:
    branches:
      - phase-00-02-starter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase00-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oosys_ci
          POSTGRES_USER: oosys
          POSTGRES_PASSWORD: oosys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oosys -d oosys_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout genuine repository commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q --cov=app.identity --cov-report=term-missing

      - name: Validate migration upgrade and downgrade on isolated SQLite
        run: |
          OOSYS_DATABASE_URL=sqlite:///./oosys-ci.db alembic upgrade head
          OOSYS_DATABASE_URL=sqlite:///./oosys-ci.db alembic downgrade base

      - name: Validate migration and persistence against PostgreSQL
        env:
          OOSYS_DATABASE_URL: postgresql+psycopg://oosys:oosys@localhost:5432/oosys_ci
        run: |
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          from sqlalchemy.exc import IntegrityError

          url = "postgresql+psycopg://oosys:oosys@localhost:5432/oosys_ci"
          engine = create_engine(url, pool_pre_ping=True)
          try:
              inspector = inspect(engine)
              assert {"platform_settings", "identity_users", "identity_organizations", "identity_memberships", "identity_roles", "identity_permissions", "identity_role_permissions", "identity_membership_roles", "identity_sessions", "identity_login_attempts", "identity_audit_events", "identity_password_reset_tokens", "identity_organization_units", "identity_invitations"}.issubset(set(inspector.get_table_names()))
              columns = {column["name"]: column for column in inspector.get_columns("platform_settings")}
              assert inspect(engine).get_pk_constraint("platform_settings")["constrained_columns"] == ["setting_key"]
              assert columns["value_json"]["nullable"] is False
              with engine.begin() as connection:
                  connection.execute(
                      text("INSERT INTO platform_settings (setting_key, value_json) VALUES (:key, CAST(:value AS json))"),
                      {"key": "ci.persistence.probe", "value": '"ok"'},
                  )
              with engine.connect() as connection:
                  value = connection.execute(
                      text("SELECT value_json FROM platform_settings WHERE setting_key = :key"),
                      {"key": "ci.persistence.probe"},
                  ).scalar_one()
                  assert value == "ok"
              with engine.begin() as connection:
                  connection.execute(text("INSERT INTO identity_organizations (id,name,slug,status) VALUES ('rls-tenant-a','Tenant A','rls-tenant-a','active'), ('rls-tenant-b','Tenant B','rls-tenant-b','active')"))
                  connection.execute(text("CREATE ROLE oosys_rls_test NOLOGIN"))
                  connection.execute(text("GRANT SELECT ON identity_organizations, identity_memberships TO oosys_rls_test"))
                  connection.execute(text("SET LOCAL ROLE oosys_rls_test"))
                  connection.execute(text("SELECT set_config('app.tenant_id', 'rls-tenant-a', true)"))
                  visible = connection.execute(text("SELECT id FROM identity_organizations WHERE id IN ('rls-tenant-a','rls-tenant-b') ORDER BY id")).scalars().all()
                  assert visible == ["rls-tenant-a"], f"PostgreSQL RLS leaked cross-tenant rows: {visible}"
              try:
                  with engine.begin() as connection:
                      connection.execute(
                          text("INSERT INTO platform_settings (setting_key, value_json) VALUES (:key, CAST(:value AS json))"),
                          {"key": "", "value": '"invalid"'},
                      )
              except IntegrityError:
                  pass
              else:
                  raise AssertionError("PostgreSQL non-empty key constraint was not enforced")
          finally:
              engine.dispose()
          PY
          alembic downgrade base

      - name: Compile application, migrations and tests
        run: python -m compileall -q app migrations tests
