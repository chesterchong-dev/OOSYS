name: Phase 00 validation

on:
  push:
    branches:
      - phase-00-02-starter
  pull_request:
    branches:
      - phase-00-02-starter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase00-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Run frontend unit tests
        run: npm run test:ci
      - name: Build frontend
        run: npm run build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oosys_ci
          POSTGRES_USER: oosys
          POSTGRES_PASSWORD: oosys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oosys -d oosys_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout genuine repository commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q --cov=app.identity --cov=app.api.operations --cov-report=term-missing

      - name: Validate migration upgrade and downgrade on isolated SQLite
        run: |
          OOSYS_DATABASE_URL=sqlite:///./oosys-ci.db alembic upgrade head
          OOSYS_DATABASE_URL=sqlite:///./oosys-ci.db alembic downgrade base

      - name: Validate migration and persistence against PostgreSQL
        env:
          OOSYS_DATABASE_URL: postgresql+psycopg://oosys:oosys@localhost:5432/oosys_ci
        run: |
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          from fastapi.testclient import TestClient
          from pydantic import SecretStr
          from app.core.config import Settings
          from app.main import create_app
          from sqlalchemy.exc import IntegrityError

          url = "postgresql+psycopg://oosys:oosys@localhost:5432/oosys_ci"
          engine = create_engine(url, pool_pre_ping=True)
          try:
              inspector = inspect(engine)
              assert {"platform_settings", "identity_users", "identity_organizations", "identity_memberships", "identity_roles", "identity_permissions", "identity_role_permissions", "identity_membership_roles", "identity_sessions", "identity_login_attempts", "identity_audit_events", "identity_password_reset_tokens", "identity_organization_units", "identity_invitations"}.issubset(set(inspector.get_table_names()))
              columns = {column["name"]: column for column in inspector.get_columns("platform_settings")}
              assert inspect(engine).get_pk_constraint("platform_settings")["constrained_columns"] == ["setting_key"]
              assert columns["value_json"]["nullable"] is False
              with engine.begin() as connection:
                  connection.execute(
                      text("INSERT INTO platform_settings (setting_key, value_json) VALUES (:key, CAST(:value AS json))"),
                      {"key": "ci.persistence.probe", "value": '"ok"'},
                  )
              with engine.connect() as connection:
                  value = connection.execute(
                      text("SELECT value_json FROM platform_settings WHERE setting_key = :key"),
                      {"key": "ci.persistence.probe"},
                  ).scalar_one()
                  assert value == "ok"
              with engine.begin() as connection:
                  connection.execute(text("INSERT INTO identity_organizations (id,name,slug,status) VALUES ('rls-tenant-a','Tenant A','rls-tenant-a','active'), ('rls-tenant-b','Tenant B','rls-tenant-b','active')"))
                  connection.execute(text("CREATE ROLE oosys_rls_test NOLOGIN"))
                  connection.execute(text("GRANT SELECT ON identity_organizations, identity_memberships TO oosys_rls_test"))
                  connection.execute(text("SET LOCAL ROLE oosys_rls_test"))
                  connection.execute(text("SELECT set_config('app.tenant_id', 'rls-tenant-a', true)"))
                  visible = connection.execute(text("SELECT id FROM identity_organizations WHERE id IN ('rls-tenant-a','rls-tenant-b') ORDER BY id")).scalars().all()
                  assert visible == ["rls-tenant-a"], f"PostgreSQL RLS leaked cross-tenant rows: {visible}"
              with engine.begin() as connection:
                  connection.execute(text("CREATE ROLE oosys_app_test LOGIN PASSWORD 'ci-only-secret'"))
                  connection.execute(text("GRANT USAGE ON SCHEMA public TO oosys_app_test"))
                  connection.execute(text("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO oosys_app_test"))
              app_url = "postgresql+psycopg://oosys_app_test:ci-only-secret@localhost:5432/oosys_ci"
              app = create_app(Settings(_env_file=None, database_url=SecretStr(app_url), allow_self_registration=True, smtp_host="localhost", email_from="noreply@example.com", invitation_accept_url="https://example.com/accept"))
              from app.identity import recovery_routes
              sent_invitations = []
              recovery_routes.send_invitation = lambda settings, recipient, token, org_id: sent_invitations.append((recipient, token, org_id))
              with TestClient(app) as client:
                  first = client.post("/api/v1/auth/register", json={"email":"rls-a@example.com","password":"Rls-strong-password-123","full_name":"RLS A","organization_name":"RLS A","organization_slug":"rls-a-org"})
                  second = client.post("/api/v1/auth/register", json={"email":"rls-b@example.com","password":"Rls-strong-password-123","full_name":"RLS B","organization_name":"RLS B","organization_slug":"rls-b-org"})
                  assert first.status_code == 201, first.text
                  assert second.status_code == 201, second.text
                  token_a = first.json()["access_token"]
                  org_b = second.json()["organization"]["id"]
                  headers_a = {"Authorization": f"Bearer {token_a}"}
                  assert client.get("/api/v1/auth/me", headers=headers_a).status_code == 200
                  assert client.get(f"/api/v1/organizations/{org_b}", headers=headers_a).status_code == 404
                  org_a = first.json()["organization"]["id"]
                  with app.state.identity_engine.begin() as connection:
                      connection.execute(text("SELECT set_config('app.tenant_id', :tenant, true), set_config('app.user_id', :user_id, true), set_config('app.user_email', :email, true)"),
                          {"tenant": org_a, "user_id": first.json()["user"]["id"], "email": "rls-a@example.com"})
                      hidden_user = connection.execute(text("SELECT id FROM identity_users WHERE email = 'rls-b@example.com'")).scalar()
                      assert hidden_user is None, "PostgreSQL RLS leaked a user outside this tenant"
                  roles = client.get(f"/api/v1/organizations/{org_a}/roles", headers=headers_a)
                  assert roles.status_code == 200, roles.text
                  owner_role = next(role["id"] for role in roles.json() if role["name"] == "Owner")
                  invitation = client.post(f"/api/v1/organizations/{org_a}/invitations", headers=headers_a,
                      json={"email":"rls-b@example.com","role_id":owner_role})
                  assert invitation.status_code == 202, invitation.text
                  assert sent_invitations and sent_invitations[0][0] == "rls-b@example.com"
                  headers_b = {"Authorization": f"Bearer {second.json()['access_token']}"}
                  accepted = client.post("/api/v1/auth/invitations/accept", headers=headers_b,
                      json={"token": sent_invitations[0][1]})
                  assert accepted.status_code == 201, accepted.text
                  switched = client.post(f"/api/v1/auth/switch-organization/{org_a}", headers=headers_b)
                  assert switched.status_code == 200, switched.text
                  assert client.get("/api/v1/auth/me", headers=headers_b).json()["organization_id"] == org_a
              try:
                  with engine.begin() as connection:
                      connection.execute(
                          text("INSERT INTO platform_settings (setting_key, value_json) VALUES (:key, CAST(:value AS json))"),
                          {"key": "", "value": '"invalid"'},
                      )
              except IntegrityError:
                  pass
              else:
                  raise AssertionError("PostgreSQL non-empty key constraint was not enforced")
          finally:
              engine.dispose()
          PY

      - name: Verify concurrent one-time recovery token consumption under PostgreSQL
        env:
          OOSYS_DATABASE_URL: postgresql+psycopg://oosys_app_test:ci-only-secret@localhost:5432/oosys_ci
          OOSYS_RUN_POSTGRES_CONCURRENCY: "1"
        run: python -m pytest -q tests/test_identity_postgres_concurrency.py

      - name: Downgrade PostgreSQL schema
        env:
          OOSYS_DATABASE_URL: postgresql+psycopg://oosys:oosys@localhost:5432/oosys_ci
        run: alembic downgrade base

      - name: Compile application, migrations and tests
        run: python -m compileall -q app migrations tests
