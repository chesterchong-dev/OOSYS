name: Dependency Audit

on:
  pull_request:
  push:
    branches: [main, phase-00-02-starter, phase-05-security-observability]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies and auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit
      - name: Audit installed dependency set
        run: python -m pip_audit
